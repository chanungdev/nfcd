name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  gui:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nfcd-gui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nfcd-gui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nfcd-gui/pnpm-lock.yaml

      - name: Build frontend (includes type check)
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check formatting
        working-directory: nfcd-gui/src-tauri
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: nfcd-gui/src-tauri
        run: cargo clippy --all-targets -- -D warnings
