name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect prerelease
        id: prerelease
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            echo "is_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_rc=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        run: |
          FLAGS=""
          if [[ "${{ steps.prerelease.outputs.is_rc }}" == "true" ]]; then
            FLAGS="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            $FLAGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gui:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nfcd-gui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nfcd-gui/pnpm-lock.yaml

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build nfcd.app (universal)
        working-directory: nfcd-gui
        run: |
          pnpm install --frozen-lockfile
          # The app version comes from the tag, so nothing to bump by hand.
          pnpm tauri build --target universal-apple-darwin --bundles app \
            --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"

      - name: Upload to the release
        run: |
          cd nfcd-gui/src-tauri/target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent nfcd.app nfcd-app.zip
          gh release upload "$GITHUB_REF_NAME" nfcd-app.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cli:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Prebuilt so `brew install` doesn't need Rust or a compile.
      - name: Build nfcd and nfcd-watcher (universal)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$t" -p nfcd -p nfcd-watcher
          done
          mkdir dist
          for b in nfcd nfcd-watcher; do
            lipo -create -output "dist/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done

      - name: Upload to the release
        run: |
          tar -czf nfcd-cli.tar.gz -C dist nfcd nfcd-watcher
          gh release upload "$GITHUB_REF_NAME" nfcd-cli.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
